version: "3.8"

services:
  obsidian-mcp:
    build: .
    container_name: obsidian-mcp-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - VAULT_PATH=/vault
      - NODE_ENV=production
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
      # OAuth 2.1 for Claude / remote MCP clients. Configure all three to enable it.
      - MCP_OAUTH_ISSUER=${MCP_OAUTH_ISSUER}
      - MCP_OAUTH_USERNAME=${MCP_OAUTH_USERNAME}
      - MCP_OAUTH_PASSWORD=${MCP_OAUTH_PASSWORD}
      # Optional fixed OAuth client (needed when Claude is configured with a client ID).
      - MCP_OAUTH_CLIENT_ID=${MCP_OAUTH_CLIENT_ID}
      - MCP_OAUTH_REDIRECT_URIS=${MCP_OAUTH_REDIRECT_URIS}
      - MCP_OAUTH_CLIENT_NAME=${MCP_OAUTH_CLIENT_NAME}
      - MCP_OAUTH_ACCESS_TOKEN_TTL=${MCP_OAUTH_ACCESS_TOKEN_TTL:-3600}
      - MCP_OAUTH_REFRESH_TOKEN_TTL=${MCP_OAUTH_REFRESH_TOKEN_TTL:-2592000}
      # Registered clients + refresh tokens survive redeploys here. Kept out of /vault
      # so it never shows up as a note in Obsidian.
      - MCP_OAUTH_STATE_PATH=/data/oauth-state.json
    volumes:
      - obsidian-vault:/vault
      - obsidian-mcp-state:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.obsidian-mcp.rule=Host(`mcp.[DOMAIN]`)"
      - "traefik.http.routers.obsidian-mcp.entrypoints=websecure"
      - "traefik.http.routers.obsidian-mcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.obsidian-mcp.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  obsidian-vault:
    driver: local
  obsidian-mcp-state:
    driver: local
